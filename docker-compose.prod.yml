# =============================================================================
# Docker Compose Production Override
# =============================================================================
# Adds production features: resource limits, health checks, logging, security.
#
# Usage:
#   scripts/docker-compose-enabled-markets.sh --env-file .env.docker \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires .env.docker file with at minimum:
#   - CORS_ORIGINS (e.g., https://stocks.yourdomain.com)
#   - At least one LLM API key for chatbot functionality
#
# =============================================================================

# Shared worker settings. Each worker sets WORKER_NODE_NAME to the name its base
# command passes to -n, so one health check pings every worker's own node.
x-worker-logging: &worker-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d $$WORKER_NODE_NAME@$$HOSTNAME"]
  interval: 60s
  timeout: 30s
  retries: 3
  start_period: 30s

x-worker-prod: &worker-prod
  env_file:
    - .env.docker
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M
      reservations:
        memory: 128M
  healthcheck: *worker-healthcheck
  logging: *worker-logging

# Daily pipeline stages (Market RS, group ranks, snapshot, breadth) are
# CPU-bound and single-threaded here: a 0.5 cap ran them at half speed. Markets
# run at different hours, so these caps rarely contend. One core keeps the
# snapshot in-process (utils/parallelism.py floors the quota); raise cpus past
# 1 only with memory headroom for each extra compute process.
x-market-jobs-prod: &market-jobs-prod
  <<: *worker-prod
  deploy:
    resources:
      limits:
        cpus: '1'
        # US breadth (~10.5k symbols) peaked at 502 MiB in 512M: ~220 MiB is
        # the idle prefork parent, which solo would drop but solo does not
        # enforce soft/hard time limits, the backstop for renewed leases.
        # Markets without a measurement get the US (largest universe) figure.
        memory: 768M
      reservations:
        memory: 128M

services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    env_file:
      - .env.docker
    environment:
      # Override CORS from .env.docker, with sensible default
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  celery-general:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: general}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  celery-datafetch:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: datafetch-global}
    deploy:
      resources:
        limits:
          # Serializes every market's price refresh; batch normalization and
          # DB writes are CPU work between provider calls.
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M

  celery-social:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: social}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 256M

  celery-marketjobs-us:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-us}

  celery-marketjobs-hk:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-hk}

  celery-marketjobs-in:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-in}

  celery-marketjobs-jp:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-jp}

  celery-marketjobs-kr:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-kr}

  celery-marketjobs-tw:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-tw}

  celery-marketjobs-cn:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-cn}

  celery-marketjobs-sg:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-sg}

  celery-marketjobs-ca:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-ca}

  celery-marketjobs-de:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-de}

  celery-marketjobs-au:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-au}

  celery-marketjobs-my:
    <<: *market-jobs-prod
    environment: {WORKER_NODE_NAME: marketjobs-my}

  celery-userscans:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-shared}

  celery-userscans-us:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-us}

  celery-userscans-hk:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-hk}

  celery-userscans-in:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-in}

  celery-userscans-jp:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-jp}

  celery-userscans-kr:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-kr}

  celery-userscans-tw:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-tw}

  celery-userscans-cn:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-cn}

  celery-userscans-sg:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-sg}

  celery-userscans-ca:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-ca}

  celery-userscans-de:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-de}

  celery-userscans-au:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-au}

  celery-userscans-my:
    <<: *worker-prod
    environment: {WORKER_NODE_NAME: userscans-my}

  celery-beat:
    env_file:
      - .env.docker
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    env_file:
      - .env.docker
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries [::1] and nginx listens on IPv4 only.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
