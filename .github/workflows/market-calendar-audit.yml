name: Market Calendar Audit

on:
  schedule:
    - cron: '10 7 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv installs far faster than pip, which took ~2 minutes here (#504).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-server.txt

      - name: Install pinned backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Audit official Market calendar coverage
        run: |
          cd backend
          if ! DRIFT_OUTPUT="$(python -m app.scripts.build_market_calendar_data --check 2>&1)"; then
            SAFE_DRIFT_OUTPUT="${DRIFT_OUTPUT//$'\n'/'%0A'}"
            echo "::warning::Market calendar generation drift detected: ${SAFE_DRIFT_OUTPUT}"
          fi
          python -m app.scripts.audit_market_calendars --github-actions
