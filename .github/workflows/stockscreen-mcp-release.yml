name: Release stockscreen-mcp

# Publishes the MCP server package to PyPI when a `stockscreen-mcp-v<version>` tag
# is pushed. The version must match stockscreen-mcp/src/stockscreen_mcp/__init__.py.
# PyPI trusted publishing: project stockscreen-mcp, this workflow file, environment `pypi`.

on:
  push:
    tags: ["stockscreen-mcp-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check the tag matches the package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' stockscreen-mcp/src/stockscreen_mcp/__init__.py)"
          if [[ "$TAG" != "stockscreen-mcp-v$version" ]]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Test
        run: uv run --directory stockscreen-mcp --locked pytest -q

      - name: Build
        run: uv build --directory stockscreen-mcp

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: stockscreen-mcp/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stockscreen-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  mcp-registry:
    name: Publish to the MCP registry
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stockscreen-mcp-registry.yml
