name: IBD Classification

# Classifies every active universe symbol that lacks an IBD industry group — for
# all markets, including those with no curated taxonomy — using the hybrid
# cascade (crosswalk → local embedding → optional LLM tiebreaker). Publishes an
# `ibd-classification-data` release artifact the daily static-site build consumes.
#
# Runs on a staggered weekly schedule after "Weekly Reference Data" has had time
# to publish, and is also manually dispatchable for one market or a full serial
# rebuild.

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Run only this market (or 'all' for the full matrix)."
        required: false
        type: choice
        default: all
        options:
          - all
          - US
          - HK
          - IN
          - JP
          - KR
          - TW
          - CN
          - CA
          - DE
          - SG
          - AU
          - MY
      gate_mode:
        description: "Regression gate mode (off=no checks, warn=log only, enforce=block publish on breach)."
        required: false
        type: choice
        default: warn
        options:
          - warn
          - enforce
          - off
  schedule:
    # Staggered single-market weekly lane. The first run starts after the
    # Saturday weekly-reference cron (08:10 ET) has had several hours to publish;
    # later runs leave enough room for the 100-min market budget plus setup.
    # The lane avoids Sunday 02:xx ET so the spring DST transition cannot skip a
    # market, and the final slots run early Monday before the static-site build.
    - cron: '30 14 * * 6' # US
      timezone: 'America/New_York'
    - cron: '30 17 * * 6' # JP
      timezone: 'America/New_York'
    - cron: '30 20 * * 6' # IN
      timezone: 'America/New_York'
    - cron: '30 23 * * 6' # HK
      timezone: 'America/New_York'
    - cron: '30 3 * * 0' # KR
      timezone: 'America/New_York'
    - cron: '30 6 * * 0' # TW
      timezone: 'America/New_York'
    - cron: '30 9 * * 0' # CN
      timezone: 'America/New_York'
    - cron: '30 12 * * 0' # CA
      timezone: 'America/New_York'
    - cron: '30 15 * * 0' # DE
      timezone: 'America/New_York'
    - cron: '30 18 * * 0' # SG
      timezone: 'America/New_York'
    - cron: '30 21 * * 0' # AU
      timezone: 'America/New_York'
    - cron: '30 0 * * 1' # MY
      timezone: 'America/New_York'

concurrency:
  # Keep repeated runs for the same scheduled slot or manual market from
  # overlapping, without letting one scheduled market cancel another or
  # interrupting an active manual full rebuild.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && github.event.schedule || github.event.inputs.market || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.market != 'all' }}

permissions:
  contents: write

jobs:
  select_markets:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.pick.outputs.markets }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MARKET: ${{ github.event.inputs.market || 'all' }}
        run: |
          ALL_MARKETS='["US","HK","IN","JP","KR","TW","CN","CA","DE","SG","AU","MY"]'
          markets="$ALL_MARKETS"

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_NAME:$SCHEDULE" in
              schedule:"30 14 * * 6") markets='["US"]' ;;
              schedule:"30 17 * * 6") markets='["JP"]' ;;
              schedule:"30 20 * * 6") markets='["IN"]' ;;
              schedule:"30 23 * * 6") markets='["HK"]' ;;
              schedule:"30 3 * * 0") markets='["KR"]' ;;
              schedule:"30 6 * * 0") markets='["TW"]' ;;
              schedule:"30 9 * * 0") markets='["CN"]' ;;
              schedule:"30 12 * * 0") markets='["CA"]' ;;
              schedule:"30 15 * * 0") markets='["DE"]' ;;
              schedule:"30 18 * * 0") markets='["SG"]' ;;
              schedule:"30 21 * * 0") markets='["AU"]' ;;
              schedule:"30 0 * * 1") markets='["MY"]' ;;
              *)
                echo "Unknown IBD classification schedule: $SCHEDULE" >&2
                exit 1
                ;;
            esac
          elif [ -n "$MARKET" ] && [ "$MARKET" != "all" ]; then
            markets="[\"$MARKET\"]"
          fi

          echo "markets=$markets" >> "$GITHUB_OUTPUT"
          echo "Selected IBD markets: $markets"

  ensure_release:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: select_markets
    runs-on: ubuntu-latest
    steps:
      - name: Ensure IBD classification release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ibd-classification-data \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create ibd-classification-data \
            --repo "${{ github.repository }}" \
            --title "IBD Classification Data" \
            --notes "Automated hybrid IBD industry-group classifications for static-site builds."

  # The deterministic crosswalk is US-derived (curated CSV ∩ US universe), so it
  # is built once here and shared with every per-market classify job as an
  # artifact rather than rebuilt per job. Best-effort: if the US weekly-reference
  # bundle is unavailable, no artifact is produced and classify degrades to
  # embedding+LLM.
  build_crosswalk:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: ensure_release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockscanner
          POSTGRES_USER: stockscanner
          POSTGRES_PASSWORD: stockscanner
        options: >-
          --health-cmd "pg_isready -U stockscanner -d stockscanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv installs far faster than pip, which took ~2 minutes here (#504).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-server.txt
      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Seed US weekly reference bundle
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/weekly-reference-seed
          BUNDLE_ASSET_NAME=""
          if gh release download weekly-reference-data \
            --pattern "weekly-reference-latest-us.json" \
            --dir /tmp/weekly-reference-seed >/dev/null 2>&1; then
            MANIFEST=/tmp/weekly-reference-seed/weekly-reference-latest-us.json
          elif gh release download weekly-reference-data \
            --pattern "weekly-reference-latest.json" \
            --dir /tmp/weekly-reference-seed >/dev/null 2>&1; then
            MANIFEST=/tmp/weekly-reference-seed/weekly-reference-latest.json
          else
            MANIFEST=""
          fi
          if [ -n "$MANIFEST" ]; then
            BUNDLE_ASSET_NAME="$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['bundle_asset_name'])" "$MANIFEST")"
          fi
          if [ -n "$BUNDLE_ASSET_NAME" ] && gh release download weekly-reference-data \
            --pattern "$BUNDLE_ASSET_NAME" \
            --dir /tmp/weekly-reference-seed >/dev/null 2>&1; then
            cd backend
            python -m app.scripts.import_weekly_reference_bundle \
              --input "/tmp/weekly-reference-seed/${BUNDLE_ASSET_NAME}" \
              --hydrate-mode full
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No US weekly reference bundle available; skipping crosswalk build."
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build crosswalk from curated CSV + US universe
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        continue-on-error: true
        run: |
          cd backend
          python -m app.scripts.load_ibd_industry_groups
          python -m app.scripts.build_ibd_crosswalk

      - name: Upload crosswalk artifact
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ibd-crosswalk
          path: data/ibd_crosswalk.json
          if-no-files-found: warn

  classify:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [select_markets, ensure_release, build_crosswalk]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # Same-market runs publish the same release asset names; queue the later
      # classify job so manual reruns cannot race scheduled publication.
      group: ${{ github.workflow }}-classify-${{ matrix.market }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Every matrix job shares the same OpenCode Go account. Keep manual
      # all-market rebuilds sequential; scheduled markets are staggered above.
      max-parallel: 1
      matrix:
        market: ${{ fromJSON(needs.select_markets.outputs.markets) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockscanner
          POSTGRES_USER: stockscanner
          POSTGRES_PASSWORD: stockscanner
        options: >-
          --health-cmd "pg_isready -U stockscanner -d stockscanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner
      # LLM tiebreaker — provider-agnostic, swap by editing these env vars in the
      # repo's GitHub Environment. Unset → classifier runs free-only.
      IBD_LLM_API_BASE: ${{ vars.IBD_LLM_API_BASE }}
      IBD_LLM_MODEL: ${{ vars.IBD_LLM_MODEL }}
      IBD_LLM_API_KEY: ${{ secrets.IBD_LLM_API_KEY }}
      # Per-call timeout (seconds) so a hung request can't exceed the job cap;
      # unset → 30s default in build_ibd_tiebreaker.
      IBD_LLM_TIMEOUT: ${{ vars.IBD_LLM_TIMEOUT }}
      # Minimum delay between provider dispatches. OpenCode Go is shared by all
      # classifications in this job; pacing avoids burst traffic while staying
      # closer to the provider's documented request budget.
      IBD_LLM_MIN_INTERVAL_SECONDS: ${{ vars.IBD_LLM_MIN_INTERVAL_SECONDS || '1.5' }}
      # Authenticate sentence-transformers' all-MiniLM-L6-v2 download from the HF
      # Hub (higher rate limits, no "unauthenticated requests" warning). Optional:
      # unset → anonymous download still works.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uv installs far faster than pip, which took ~2 minutes here (#504).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-server.txt

      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.txt

      # Pull the shared US-derived crosswalk into data/ where
      # build_ibd_classification_bundle expects it. Non-fatal: if the prep job
      # produced none, the cascade runs embedding+LLM only.
      - name: Download IBD crosswalk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ibd-crosswalk
          path: data

      - name: Seed weekly reference bundle (universe to classify)
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/weekly-reference-seed
          export MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          BUNDLE_ASSET_NAME=""

          if gh release download weekly-reference-data \
            --pattern "weekly-reference-latest-${MARKET_LOWER}.json" \
            --dir /tmp/weekly-reference-seed >/dev/null 2>&1; then
            BUNDLE_ASSET_NAME="$(python - <<'PY'
          import json, os
          from pathlib import Path
          market = os.environ["MARKET_LOWER"]
          manifest = json.loads(Path(f"/tmp/weekly-reference-seed/weekly-reference-latest-{market}.json").read_text(encoding="utf-8"))
          print(manifest["bundle_asset_name"])
          PY
            )"
          elif [ "${{ matrix.market }}" = "US" ] && gh release download weekly-reference-data \
            --pattern "weekly-reference-latest.json" \
            --dir /tmp/weekly-reference-seed >/dev/null 2>&1; then
            BUNDLE_ASSET_NAME="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/weekly-reference-seed/weekly-reference-latest.json").read_text(encoding="utf-8"))
          print(manifest["bundle_asset_name"])
          PY
            )"
          fi

          if [ -n "$BUNDLE_ASSET_NAME" ] && gh release download weekly-reference-data \
            --pattern "$BUNDLE_ASSET_NAME" \
            --dir /tmp/weekly-reference-seed >/dev/null 2>&1; then
            cd backend
            python -m app.scripts.import_weekly_reference_bundle \
              --input "/tmp/weekly-reference-seed/${BUNDLE_ASSET_NAME}" \
              --hydrate-mode full
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No weekly reference bundle available for ${{ matrix.market }}; skipping classification."
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load curated IBD CSV (canonical taxonomy + US seed)
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        run: |
          cd backend
          python -m app.scripts.load_ibd_industry_groups

      - name: Download previous IBD bundle (for churn diff)
        id: prev
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET: ${{ matrix.market }}
        run: |
          export MARKET_LOWER="$(echo "$MARKET" | tr '[:upper:]' '[:lower:]')"
          mkdir -p /tmp/ibd-prev
          PREV_BUNDLE=""
          if gh release download ibd-classification-data \
            --pattern "ibd-classification-latest-${MARKET_LOWER}.json" \
            --dir /tmp/ibd-prev >/dev/null 2>&1; then
            PREV_ASSET="$(python - <<'PY'
          import json, os
          from pathlib import Path
          market = os.environ["MARKET_LOWER"]
          try:
              manifest = json.loads(Path(f"/tmp/ibd-prev/ibd-classification-latest-{market}.json").read_text(encoding="utf-8"))
              print(manifest.get("bundle_asset_name", ""))
          except Exception:
              print("")
          PY
            )"
            if [ -n "$PREV_ASSET" ] && gh release download ibd-classification-data \
              --pattern "$PREV_ASSET" --dir /tmp/ibd-prev >/dev/null 2>&1; then
              PREV_BUNDLE="/tmp/ibd-prev/${PREV_ASSET}"
            fi
          fi
          echo "prev_bundle=${PREV_BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "Previous bundle: ${PREV_BUNDLE:-<none>}"

      - name: Build IBD classification bundle
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        env:
          MARKET: ${{ matrix.market }}
          PREV_BUNDLE: ${{ steps.prev.outputs.prev_bundle }}
          # Bound the paid LLM tier so a large foreign universe finishes under the
          # 120-min job cap: once the deadline or call budget trips, remaining
          # symbols use the free deterministic fallback (soft attach, on by default).
          MAX_RUNTIME_MINUTES: ${{ vars.IBD_MAX_RUNTIME_MINUTES || '100' }}
          MAX_LLM_CALLS: ${{ vars.IBD_MAX_LLM_CALLS || '600' }}
        run: |
          cd backend
          PREV_ARG=()
          if [ -n "$PREV_BUNDLE" ]; then
            PREV_ARG=(--prev-bundle "$PREV_BUNDLE")
          fi
          python -m app.scripts.build_ibd_classification_bundle \
            --market "$MARKET" \
            --output-dir /tmp/ibd-classification \
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES" \
            --max-llm-calls "$MAX_LLM_CALLS" \
            "${PREV_ARG[@]}"

      - name: Upload IBD health report
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET: ${{ matrix.market }}
        run: |
          MARKET_LOWER="$(echo "$MARKET" | tr '[:upper:]' '[:lower:]')"
          HEALTH_PATH="/tmp/ibd-classification/ibd-classification-health-${MARKET_LOWER}.json"
          if [ ! -f "$HEALTH_PATH" ]; then
            echo "Missing IBD health report at $HEALTH_PATH" >&2
            exit 1
          fi
          gh release upload ibd-classification-data "$HEALTH_PATH" --clobber

      - name: Evaluate classification health gate
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        env:
          MARKET: ${{ matrix.market }}
          MAX_CHURN_PCT: ${{ vars.IBD_GATE_MAX_CHURN_PCT || '25' }}
          MIN_COVERAGE_PCT: ${{ vars.IBD_GATE_MIN_COVERAGE_PCT || '50' }}
          GATE_MODE: ${{ github.event.inputs.gate_mode || vars.IBD_GATE_MODE || 'warn' }}
        run: |
          cd backend
          MARKET_LOWER="$(echo "$MARKET" | tr '[:upper:]' '[:lower:]')"
          python -m app.scripts.check_ibd_classification_gate \
            --health "/tmp/ibd-classification/ibd-classification-health-${MARKET_LOWER}.json" \
            --max-churn-pct "$MAX_CHURN_PCT" \
            --min-coverage-pct "$MIN_COVERAGE_PCT" \
            --mode "$GATE_MODE"

      - name: Upload IBD classification assets
        if: ${{ steps.seed.outputs.seeded == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          BUNDLE_PATH="$(find /tmp/ibd-classification -maxdepth 1 -name "ibd-classification-${MARKET_LOWER}-*.json.gz" | head -n 1)"
          MANIFEST_PATH="/tmp/ibd-classification/ibd-classification-latest-${MARKET_LOWER}.json"

          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$MANIFEST_PATH" ]; then
            echo "Missing IBD classification outputs" >&2
            exit 1
          fi

          gh release upload ibd-classification-data "$BUNDLE_PATH" --clobber
          gh release upload ibd-classification-data "$MANIFEST_PATH" --clobber
